name: CI/CD Pipeline

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  version-check:
    name: Version incremented
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version against the target branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          base_version="$(
            git show "${BASE_SHA}:pyproject.toml" |
            sed -n 's/^version = "\(.*\)"/\1/p'
          )"
          pr_version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          base_version_format='^[0-9]+\.[0-9]+(\.[0-9]+)?$'
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'

          if [[ ! "${base_version}" =~ ${base_version_format} ]]; then
            echo "::error::Invalid base version '${base_version}'"
            exit 1
          fi

          if [[ ! "${pr_version}" =~ ${semver} ]]; then
            echo "::error::Pull request version '${pr_version}' must use the X.Y.Z format"
            exit 1
          fi

          if [[ "${pr_version}" == "${base_version}" ]]; then
            echo "::error::Version is still ${base_version}. Run: uv version --bump patch"
            exit 1
          fi

          highest_version="$(printf '%s\n' "${base_version}" "${pr_version}" | sort -V | tail -n 1)"
          if [[ "${highest_version}" != "${pr_version}" ]]; then
            echo "::error::Version ${pr_version} must be greater than ${base_version}"
            exit 1
          fi

          echo "Version incremented: ${base_version} -> ${pr_version}"

  linter:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --all-extras --dev --frozen --no-build
      - name: Run linter
        run: uv run --no-build --frozen --no-sync ruff check .
      - name: Run formater check
        run: uv run --frozen --no-sync --no-build ruff format --check .
      - name: Validate release notes
        run: uv run --frozen --no-sync --no-build python manage.py validate_release_notes

  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --all-extras --dev --frozen --no-build
      - name: Run Tests
        run: uv run --frozen --no-sync --no-build python manage.py test

  extension-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run extension tests
        run: node --test firefox-extension/tests/*.test.js
      - name: Run front-end tests
        run: node --test gifts/tests_js/*.test.cjs

  build-and-push:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Read application version
        id: application-version
        run: echo "value=$(uv version --short)" >> "${GITHUB_OUTPUT}"

      - name: Lowercase image name
        run: |
          echo "IMAGE_NAME_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:latest
          build-args: |
            APP_VERSION=${{ steps.application-version.outputs.value }}
            DEPLOYMENT_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.application-version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
