name: Deploy to production

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy deployment files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,nginx.conf"
          target: "~/app"

      - name: Update Production via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/app
            
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            cat << EOF > .env
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            BUG_REPORT_TOKEN=${{ secrets.BUG_REPORT_TOKEN }}
            BUG_REPORT_REPOSITORY=${{ vars.BUG_REPORT_REPOSITORY }}
            BUG_REPORT_LABELS=${{ vars.BUG_REPORT_LABELS }}
            TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY }}
            TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}
            PUBLIC_BASE_URL=${{ vars.PUBLIC_BASE_URL || 'https://noscadeaux.fr' }}
            TWA_SHA256_FINGERPRINTS=${{ vars.TWA_SHA256_FINGERPRINTS }}
            NPM_NETWORK=${{ vars.NPM_NETWORK || 'proxy' }}
            DEV=False
            EOF

            if ! docker network inspect "${{ vars.NPM_NETWORK || 'proxy' }}" >/dev/null 2>&1; then
              echo "Docker network '${{ vars.NPM_NETWORK || 'proxy' }}' does not exist. Configure the shared Nginx Proxy Manager network first."
              exit 1
            fi

            docker compose pull
            docker compose up -d --remove-orphans
            
            docker image prune -f
