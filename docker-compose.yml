services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=noscadeaux
      - POSTGRES_USER=user_cadeaux
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_cadeaux -d noscadeaux"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/cyprienj/noscadeaux:latest
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --no-input --clear &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 config.wsgi:application"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DATABASE_URL=postgres://user_cadeaux:${POSTGRES_PASSWORD}@db:5432/noscadeaux
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEV=False
      - ANYMAIL_RESEND_API_KEY=${RESEND_API_KEY}
      - BUG_REPORT_REPOSITORY=${BUG_REPORT_REPOSITORY:-}
      - BUG_REPORT_TOKEN=${BUG_REPORT_TOKEN:-}
      - BUG_REPORT_LABELS=${BUG_REPORT_LABELS:-bug,source:user-report,status:unconfirmed}
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://noscadeaux.fr}
    depends_on:
      db:
        condition: service_healthy

  scheduler:
      image: ghcr.io/cyprienj/noscadeaux:latest
      command: >
        sh -c "sleep 30;
               while true; do
                 python manage.py send_notification_digests;
                 python manage.py send_event_reminders;
                 python manage.py purge_deleted_shared_lists;
                 python manage.py cleanup_unverified_users;
                 python manage.py cleanup_auth_throttle_events;
                 python manage.py cleanup_group_invitation_dispatches;
                 sleep 3600;
               done"
      environment:
        - DATABASE_URL=postgres://user_cadeaux:${POSTGRES_PASSWORD}@db:5432/noscadeaux
        - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
        - DEV=False
        - ANYMAIL_RESEND_API_KEY=${RESEND_API_KEY}
        - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://noscadeaux.fr}
      depends_on:
        db:
          condition: service_healthy
      restart: unless-stopped
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    networks:
      default:
      proxy:
        aliases:
          - noscadeaux-nginx

networks:
  proxy:
    external: true
    name: ${NPM_NETWORK:-proxy}

volumes:
  postgres_data:
  static_volume:
     name: noscadeaux_static
  media_volume:
    name: noscadeaux_media
