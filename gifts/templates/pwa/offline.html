<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e11d48">
    <title>nosCadeaux — Hors connexion / Offline</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center;
               background: #faf7f2; color: #292524; font-family: system-ui, sans-serif; }
        main { max-width: 32rem; padding: 2rem; text-align: center; }
        button { border: 0; border-radius: 2rem; padding: .8rem 1.5rem;
                 background: #e11d48; color: white; font: inherit; cursor: pointer; }
        @media (prefers-color-scheme: dark) { body { background: #292524; color: #faf7f2; } }
    </style>
</head>
<body>
    <main>
        <p>nosCadeaux</p>
        <h1 id="heading">Vous êtes hors connexion</h1>
        <p id="message">Reconnectez-vous à Internet pour consulter vos listes et modifier vos cadeaux.</p>
        <button id="retry" type="button">Réessayer</button>
    </main>
    <script>
        const language = location.pathname.match(/^\/(fr|en)(\/|$)/)?.[1]
            || (navigator.language.startsWith('en') ? 'en' : 'fr');
        document.documentElement.lang = language;
        if (language === 'en') {
            document.getElementById('heading').textContent = 'You are offline';
            document.getElementById('message').textContent = 'Reconnect to the Internet to view your lists and update your gifts.';
            document.getElementById('retry').textContent = 'Try again';
        }
        document.getElementById('retry').addEventListener('click', () => location.reload());
    </script>
</body>
</html>
