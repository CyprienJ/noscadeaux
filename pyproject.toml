[project]
name = "nosCadeaux"
version = "1.3.9"
description = "A website to manage a gift list"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "dj-database-url>=3.0.1",
    "django>=6.0",
    "django-anymail>=14.0",
    "django-resized>=1.0.3",
    "django-unfold>=0.92.0",
    "gunicorn>=23.0.0",
    "markdown>=3.10",
    "pillow>=12.1.1",
    "psycopg2-binary>=2.9.11",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "ruff>=0.15.5",
]

[tool.ruff]
exclude = [".venv", "build", "dist", "gifts/migrations"]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
